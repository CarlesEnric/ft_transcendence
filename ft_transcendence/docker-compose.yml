networks:
  transcendence-net:
    driver: bridge

volumes:
  auth-db:
  user-db:
  game-db:
  match-db:
  user-uploads:
  frontend-static:

services:
  # API Gateway - Only exposed service
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"  # HTTPS on port 3000
    networks:
      - transcendence-net
    volumes:
      - ./services/api-gateway/src:/app/src:ro        # Read-only: prevents container from modifying source code
      - frontend-static:/app/frontend:ro              # Read-only: static files from frontend build
    env_file:
      - ./services/api-gateway/.env
      - ./services/api-gateway/.env_host_ip
    depends_on:
      - auth-service
      - user-service
      - game-service
      - match-service
      - frontend

  # Frontend - TypeScript SPA with Tailwind CSS (Static files only)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    networks:
      - transcendence-net
    env_file:
      - ./frontend/.env_host_ip
    volumes:
      - frontend-static:/app/dist                     # Share built static files with API Gateway

  # Auth Service - JWT Authentication
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth
    restart: unless-stopped
    networks:
      - transcendence-net
    volumes:
      - ./services/auth-service/src:/app/src:ro       # Read-only: prevents container from modifying source code
      - auth-db:/app/database                         # Read-write: database needs to be writable
    env_file:
      - ./services/auth-service/.env
      - ./services/auth-service/.env_host_ip

  # User Service - Profile management
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user
    restart: unless-stopped
    networks:
      - transcendence-net
    volumes:
      - ./services/user-service/src:/app/src:ro       # Read-only: prevents container from modifying source code
      - auth-db:/app/database                         # Shared DB with auth-service
      - user-uploads:/app/uploads                     # Read-write: file uploads need to be writable
    env_file:
      - ./services/user-service/.env
      - ./services/user-service/.env_host_ip
    depends_on:
      - auth-service

  # Game Service - Pong logic + WebSockets
  game-service:
    build:
      context: ./services/game-service
      dockerfile: Dockerfile
    container_name: game
    restart: unless-stopped
    networks:
      - transcendence-net
    volumes:
      - ./services/game-service/src:/app/src:ro       # Read-only: prevents container from modifying source code
      - game-db:/app/database                         # Read-write: database needs to be writable
    env_file:
      - ./services/game-service/.env
      - ./services/game-service/.env_host_ip
    depends_on:
      - auth-service
      - user-service

  # Match Service - History/statistics
  match-service:
    build:
      context: ./services/match-service
      dockerfile: Dockerfile
    container_name: match
    restart: unless-stopped
    networks:
      - transcendence-net
    volumes:
      - ./services/match-service/src:/app/src:ro      # Read-only: prevents container from modifying source code
      - match-db:/app/database                        # Read-write: database needs to be writable
    env_file:
      - ./services/match-service/.env
      - ./services/match-service/.env_host_ip
    depends_on:
      - auth-service
      - user-service
      - game-service

